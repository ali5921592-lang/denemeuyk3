ana.","Una mente descansada es un camino despejado.","No corras; el día seguirá tu ritmo.","Haz bien una sola cosa hoy, es suficiente.","Un buen día empieza con una buena respiración.","Sé amable contigo, el día es largo.","Puedes más de lo que creías ayer.","Lo que empiezas hoy será tu hábito mañana.","Una mañana tranquila construye un día fuerte.","Dedica tu energía a lo que te importa.","No necesitas ser perfecto para ganar el día.","Cada mañana es una página nueva y tú tienes la pluma.","Un poco de orden trae mucha calma.","Hoy: un poco más lento, un poco más atento."],de:["Ein kleiner Schritt heute, ein großer Unterschied morgen.","Ein ausgeruhter Kopf ist ein freier Weg.","Keine Eile; der Tag passt sich deinem Tempo an.","Mach heute eine Sache richtig, das genügt.","Ein guter Tag beginnt mit einem guten Atemzug.","Sei freundlich zu dir, der Tag ist lang.","Du kannst mehr, als du gestern dachtest.","Was du heute beginnst, wird morgen Gewohnheit.","Ein stiller Morgen baut einen starken Tag.","Gib deine Energie dem, was dir wichtig ist.","Du musst nicht perfekt sein, um den Tag zu gewinnen.","Jeder Morgen ist eine neue Seite, du hältst den Stift.","Ein wenig Ordnung bringt viel Ruhe.","Heute: etwas langsamer, etwas achtsamer."],fr:["Un petit pas aujourd'hui, une grande différence demain.","Un esprit reposé, c'est une route dégagée.","Ne te presse pas ; la journée suivra ton rythme.","Fais bien une seule chose aujourd'hui, cela suffit.","Une bonne journée commence par une bonne respiration.","Sois doux avec toi, la journée est longue.","Tu peux plus que tu ne le pensais hier.","Ce que tu commences aujourd'hui deviendra ton habitude.","Un matin calme construit une journée solide.","Donne ton énergie à ce qui compte pour toi.","Pas besoin d'être parfait pour réussir ta journée.","Chaque matin est une page neuve et tu tiens le stylo.","Un peu d'ordre apporte beaucoup de calme.","Aujourd'hui : un peu plus lent, un peu plus attentif."],pt:["Um pequeno passo hoje, uma g   function syncVisual(){const v=q('#v36BreathVisual'),toggle=q('#v36VoiceToggle'),label=q('#v36PhaseLabel'),count=q('#v36CountLabel');if(!v)return;const s=state();v.classList.remove('v36-phase-idle','v36-phase-in','v36-phase-hold','v36-phase-out','v36-running');v.classList.add('v36-phase-'+s.phase);if(s.phase!=='idle')v.classList.add('v36-running');if(label)label.textContent=s.phase==='idle'?'Hazır':phaseText[s.phase]||'Hazır';if(count)count.textContent=s.phase==='idle'?'Dokun ve başla':s.left+' saniye';if(toggle){toggle.classList.toggle('off',!voiceGuide);q('span',toggle).textContent=voiceGuide?'Sesli rehber açık':'Sesli rehber kapalı';}}
  function voiceTick(){const s=state(),phaseKey=s.phase+':'+(typeof brIdx==='undefined'?'x':brIdx);if(s.phase==='idle'){lastPhaseKey='';lastCountKey='';return;}if(phaseKey!==lastPhaseKey){lastPhaseKey=phaseKey;lastCountKey='';say(phaseText[s.phase]||'');return;}if(s.left<=3&&s.left>0){const key=phaseKey+':'+s.left;if(key!==lastCountKey){lastCountKey=key;say(countText[s.left]||String(s.left));}}}
  function init(){mountBreath();syncVisual();clearInterval(poll);poll=setInterval(()=>{syncVisual();voiceTick();},450);}
  init();window.SleepifyBreath={voiceOn:()=>voiceGuide,refresh:syncVisual};
})();
</script>

<script>
/* ============================================================================
   Barkod yedek çözücü (v39)
   Android WebView'de BarcodeDetector API'si yoktur. Bu modül yoksa devreye
   girer ve kamera karesinden EAN-13 / EAN-8 / UPC-A barkodlarını okur.
   Yöntem: karenin ortasından yatay bir tarama çizgisi alınır, siyah-beyaz
   geçişleri ölçülüp çubuk genişlikleri desenlere eşlenir.
   ============================================================================ */
(function(){
  if('BarcodeDetector' in window) return;      /* yerleşik varsa dokunma */

  /* EAN kodlama tabloları */
  const L=['0001101','0011001','0010011','0111101','0100011',
           '0110001','0101111','0111011','0110111','0001011'];
  const G=L.map(s=>s.split('').reverse().map(b=>b==='1'?'0':'1').join(''));
  const R=L.map(s=>s.split('').map(b=>b==='1'?'0':'1').join(''));
  const PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG',
                'LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  /* Tarama çizgisini siyah/beyaz dizisine çevirir */
  function binarize(data,w,y){
    let min=255,max=0;
    const row=new Uint8Array(w);
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const v=(data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114)|0;
      row[x]=v; if(v<min)min=v; if(v>max)max=v;
    }
    if(max-min<45)return null;                  /* kontrast yetersiz */
    const th=(min+max)/2;
    let bits='';
    for(let x=0;x<w;x++)bits+=row[x]<th?'1':'0';
    return bits;
  }
  /* Ardışık aynı bitlerin uzunluklarını çıkarır */
  function runs(bits){
    const out=[];let c=bits[0],n=1;
    for(let i=1;i<bits.length;i++){
      if(bits[i]===c)n++;else{out.push({v:c,n:n});c=bits[i];n=1;}
    }
    out.push({v:c,n:n});
    return out;
  }
  /* 7 modüllük bir haneyi çözer */
  function digit(bits,tables){
    for(let t=0;t<tables.length;t++){
      const idx=tables[t].indexOf(bits);
      if(idx>=0)return{d:idx,set:t};
    }
    return null;
  }
  function checksum(ds){
    let s=0;
    for(let i=0;i<12;i++)s+=ds[i]*(i%2?3:1);
    return (10-(s%10))%10;
  }
  /* Bir bit dizisinden EAN-13 okumayı dener */
  function decodeLine(bits){
    const rs=runs(bits);
    /* başlangıç koruyucusu: 1-1-1 dar çubuklar */
    for(let s=0;s<rs.length-30;s++){
      if(rs[s].v!=='1')continue;
      const unit=(rs[s].n+rs[s+1].n+rs[s+2].n)/3;
      if(unit<1)continue;
      /* koruyucu oranları kabaca eşit olmalı */
      const ok=[rs[s].n,rs[s+1].n,rs[s+2].n].every(n=>Math.abs(n-unit)<=unit*0.6);
      if(!ok)continue;
      /* koruyucudan sonraki 95 modülü topla */
      let pos=0;
      for(let k=0;k<s;k++)pos+=rs[k].n;
      const start=pos, total=Math.round(unit*95);
      if(start+total>bits.length)continue;
      /* modül modül örnekle */
      let mod='';
      for(let m=0;m<95;m++){
        const px=Math.floor(start+(m+0.5)*unit);
        mod+=bits[px]||'0';
      }
      if(mod.slice(0,3)!=='101')continue;
      if(mod.slice(45,50)!=='01010')continue;
      if(mod.slice(92,95)!=='101')continue;
      /* sol 6 hane */
      const ds=[];let parity='';
      for(let i=0;i<6;i++){
        const r=digit(mod.slice(3+i*7,10+i*7),[L,G]);
        if(!r)return null;
        ds.push(r.d); parity+=r.set?'G':'L';
      }
      const first=PARITY.indexOf(parity);
      if(first<0)return null;
      /* sağ 6 hane */
      for(let i=0;i<6;i++){
        const r=digit(mod.slice(50+i*7,57+i*7),[R]);
        if(!r)return null;
        ds.push(r.d);
      }
      const all=[first].concat(ds);
      if(checksum(all)!==all[12])continue;
      return all.join('');
    }
    return null;
  }

  /* BarcodeDetector arayüzünü taklit eder */
  window.BarcodeDetector=class{
    constructor(){ this.cv=document.createElement('canvas'); }
    static getSupportedFormats(){ return Promise.resolve(['ean_13','ean_8','upc_a']); }
    async detect(video){
      const w=video.videoWidth|0,h=video.videoHeight|0;
      if(!w||!h)return [];
      /* yatay çözünürlük 640'a indirilir: hız için yeterli */
      const cw=Math.min(640,w),ch=Math.round(h*cw/w);
      this.cv.width=cw; this.cv.height=ch;
      const c=this.cv.getContext('2d',{willReadFrequently:true});
      c.drawImage(video,0,0,cw,ch);
      const img=c.getImageData(0,0,cw,ch).data;
      /* ortadan yukarı ve aşağı doğru birkaç çizgi dene */
      const mid=ch>>1;
      const lines=[mid,mid-Math.round(ch*0.12),mid+Math.round(ch*0.12),
                   mid-Math.round(ch*0.24),mid+Math.round(ch*0.24)];
      for(const y of lines){
        if(y<0||y>=ch)continue;
        const bits=binarize(img,cw,y);
        if(!bits)continue;
        let code=decodeLine(bits);
        if(!code){                                  /* ters yönden dene */
          code=decodeLine(bits.split('').reverse().join(''));
        }
        if(code)return [{rawValue:code,format:'ean_13'}];
      }
      return [];
    }
  };
  console.info('Sleepify: barkod yedek çözücü etkin');
})();
</script>
